aid: airwave
name: Airwave
description: >-
  Airwave (Indianapolis, founded 2022) is a field intelligence platform for industrial and
  field-service technicians: ANSI Z87+ smart safety glasses with a built-in camera,
  microphone and speakers record the job, and the Airwave software turns the footage into
  inspection reports, job hazard analyses, customer summaries and searchable job notes, with an
  AI assistant ("Blue") answering questions from uploaded manuals, parts lists and team
  knowledge. The pricing page lists API integrations (ERP, CRM, CMMS) and an Airwave Glasses
  SDK only in the custom-priced Video Intelligence tier behind a sales conversation; no public
  developer documentation, API reference or machine-readable contract is published.
